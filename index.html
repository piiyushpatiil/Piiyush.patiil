<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Matrix | All-in-One</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: radial-gradient(circle at 50% 20%, #1a103c, #06050b 80%); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; }

    /* AUTH SCREEN */
    #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; width: 100%; max-width: 400px; text-align: center; gap: 20px; }
    .app-title { font-size: 2.3rem; font-weight: 900; background: linear-gradient(45deg, #ff007f, #00f2fe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .auth-card { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.12); padding: 25px; border-radius: 24px; width: 100%; box-shadow: 0 15px 35px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 12px; }
    .input-field { width: 100%; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: #fff; }
    .btn-login { background: linear-gradient(45deg, #4285F4, #34A853); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; }
    .btn-email-auth { background: linear-gradient(45deg, #ff007f, #7928ca); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; }
    .btn-guest { background: rgba(255, 255, 255, 0.08); color: #ddd; border: 1px solid rgba(255, 255, 255, 0.2); padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; }
    .auth-toggle { font-size: 0.8rem; color: #00f2fe; cursor: pointer; }

    /* PORTAL SCREEN */
    #portal-screen { display: none; width: 100%; max-width: 600px; flex-direction: column; gap: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.05); padding: 12px 18px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.1); }
    .door-grid { display: flex; flex-direction: column; gap: 15px; perspective: 1000px; }
    .door-row { display: flex; gap: 15px; }
    .door-wrapper { flex: 1; height: 130px; background: #080612; border-radius: 18px; position: relative; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; }
    .door-panel { width: 100%; height: 100%; position: absolute; top:0; left:0; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 0.6s; transform-origin: left; z-index: 2; color: #fff; font-weight: 700; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
    .door-wrapper.opening .door-panel { transform: rotateY(-115deg); }
    .door-inside-bg { position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #ff007f, #1a102f); }

    /* CHAT SCREEN */
    #chat-screen { display: none; width: 100%; max-width: 600px; height: 90vh; background: rgba(255,255,255,0.05); border-radius: 20px; padding: 15px; }
    .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
    .msg-incoming { align-self: flex-start; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; }
    .msg-outgoing { align-self: flex-end; background: linear-gradient(135deg, #00f2fe, #4facfe); color: #000; padding: 10px; border-radius: 10px; }
    .chat-input-area { display: flex; gap: 5px; }
    .chat-input { flex: 1; padding: 10px; border-radius: 10px; border: none; }
    .btn-send { padding: 10px; border-radius: 10px; border: none; background: #ff007f; color: #fff; }
  </style>
</head>
<body>

  <!-- 1. Auth Screen -->
  <div id="auth-screen">
    <div class="app-title">✨ PORTAL MATRIX</div>
    <div class="auth-card">
      <input type="email" id="emailInput" class="input-field" placeholder="Email" />
      <input type="password" id="passInput" class="input-field" placeholder="Password" />
      <button class="btn-email-auth" id="emailActionBtn" onclick="handleEmailAuth()">📧 Email Login</button>
      <div class="auth-toggle" onclick="toggleAuthMode()">नवीन युजर? Sign Up करा</div>
      <button class="btn-login" onclick="loginGoogle()">🚀 Google Login</button>
      <button class="btn-guest" onclick="enterGuest()">👤 Guest Entry</button>
    </div>
  </div>

  <!-- 2. Main Portal -->
  <div id="portal-screen">
    <header>
      <div id="user-display">👤 User</div>
      <button class="btn-exit" onclick="logout()">बाहेर पडा</button>
    </header>
    <div class="door-grid">
      <!-- Doors (1 to 6) -->
      <div class="door-row">
        <div class="door-wrapper" onclick="openRoom(this)"><div class="door-panel" style="background:#833ab4;">💔 Shayari</div><div class="door-inside-bg">⏳</div></div>
        <div class="door-wrapper" onclick="openRoom(this)"><div class="door-panel" style="background:#f12711;">😂 Jokes</div><div class="door-inside-bg">⏳</div></div>
      </div>
      <div class="door-row">
        <div class="door-wrapper" onclick="openLiveChat(this)"><div class="door-panel" style="background:#00f2fe; color:#000;">🌐 Live Chat</div><div class="door-inside-bg">💬</div></div>
        <div class="door-wrapper" onclick="openRoom(this)"><div class="door-panel" style="background:#1f4037;">🔒 Private</div><div class="door-inside-bg">⏳</div></div>
      </div>
      <div class="door-row">
        <div class="door-wrapper" onclick="openRoom(this)"><div class="door-panel" style="background:#11998e;">📰 News</div><div class="door-inside-bg">⏳</div></div>
        <div class="door-wrapper" onclick="openRoom(this)"><div class="door-panel" style="background:#3a3d40;">⏳ Soon</div><div class="door-inside-bg">🔒</div></div>
      </div>
    </div>
  </div>

  <!-- 3. Chat Room -->
  <div id="chat-screen">
    <h3 style="margin-bottom:10px;">🌐 Live Chat</h3>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" class="chat-input" placeholder="Type..." />
      <button class="btn-send" onclick="sendChatMessage()">Send</button>
    </div>
  </div>

  <script>
    const firebaseConfig = { apiKey: "AIzaSyObiMMjsay7Bv2nODc93Jhb908UtV6SPuo", authDomain: "piiyush-patii.firebaseapp.com", projectId: "piiyush-patii", storageBucket: "piiyush-patii.firebasestorage.app", messagingSenderId: "943004269137", appId: "1:943004269137:web:13e65558654621d4855670" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let userName = "Guest";
    let isSignUpMode = false;

    // Google Login Logic
    auth.getRedirectResult().then(res => { if(res.user) showPortal(res.user.displayName); });
    function loginGoogle() { auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()); }
    
    // Email Auth Logic
    function toggleAuthMode() { isSignUpMode = !isSignUpMode; document.getElementById('emailActionBtn').innerText = isSignUpMode ? "Sign Up" : "Email Login"; }
    function handleEmailAuth() {
        const e = document.getElementById('emailInput').value, p = document.getElementById('passInput').value;
        if(isSignUpMode) auth.createUserWithEmailAndPassword(e, p).then(() => alert("Created!")).catch(err => alert(err.message));
        else auth.signInWithEmailAndPassword(e, p).catch(err => alert(err.message));
    }

    function enterGuest() { userName = prompt("Name:"); showPortal(userName); }
    function showPortal(name) { document.getElementById('auth-screen').style.display='none'; document.getElementById('portal-screen').style.display='flex'; document.getElementById('user-display').innerText = name; }
    function logout() { auth.signOut().then(() => location.reload()); }
    
    function openRoom(el) { el.classList.add('opening'); setTimeout(() => alert("Coming Soon!"), 600); setTimeout(() => el.classList.remove('opening'), 1000); }
    function openLiveChat(el) { el.classList.add('opening'); setTimeout(() => { document.getElementById('portal-screen').style.display='none'; document.getElementById('chat-screen').style.display='flex'; }, 600); }
    function backToMatrix() { document.getElementById('chat-screen').style.display='none'; document.getElementById('portal-screen').style.display='flex'; }

    // Chat Logic
    db.collection("world_chats").orderBy("createdAt", "asc").onSnapshot(snap => {
        let html = "";
        snap.forEach(doc => { const d = doc.data(); html += `<div class="${d.sender===userName?'msg-outgoing':'msg-incoming'}"><div class="msg-sender">${d.sender}</div>${d.text}</div>`; });
        document.getElementById('chatMessages').innerHTML = html;
    });

    function sendChatMessage() {
        const text = document.getElementById('chatInput').value;
        db.collection("world_chats").add({ text, sender: userName, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        document.getElementById('chatInput').value = "";
    }
  </script>
</body>
</html>
