<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#22c55e"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <title>MyVault - Personal Password Manager</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #07100f;
      color: white;
      min-height: 100vh;
    }

    button,
    input {
      font-family: inherit;
    }

    .screen {
      min-height: 100vh;
    }

    /* LOGIN SCREEN */

    #lockScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #101b19;
      border: 1px solid #29413b;
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border-radius: 22px;
      background: #22c55e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9aada8;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .security-box {
      background: #0b1513;
      border: 1px solid #29413b;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 25px;
      text-align: center;
      color: #b8c8c4;
      font-size: 13px;
      line-height: 1.5;
    }

    label {
      display: block;
      color: #dce8e5;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .password-box {
      position: relative;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #304943;
      border-radius: 12px;
      background: #0b1513;
      color: white;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #22c55e;
    }

    .password-box input {
      padding-right: 50px;
    }

    .show-btn {
      position: absolute;
      right: 10px;
      top: 9px;
      background: none;
      border: none;
      color: #9aada8;
      font-size: 19px;
      padding: 8px;
      cursor: pointer;
    }

    .primary-btn {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #22c55e;
      color: #041009;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .secondary-btn {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 1px solid #304943;
      border-radius: 12px;
      background: transparent;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    .footer {
      text-align: center;
      color: #71857f;
      font-size: 12px;
      margin-top: 24px;
    }

    /* VAULT */

    #vaultScreen {
      display: none;
      padding: 20px;
    }

    .vault-container {
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .brand {
      font-size: 24px;
      font-weight: bold;
    }

    .lock-btn {
      border: 1px solid #304943;
      background: #172521;
      color: white;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
    }

    .welcome {
      color: #899e98;
      margin-bottom: 20px;
    }

    .search-box {
      margin-bottom: 20px;
    }

    .items {
      display: grid;
      gap: 12px;
    }

    .item {
      background: #101b19;
      border: 1px solid #243a35;
      border-radius: 16px;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .item-user {
      color: #899e98;
      font-size: 13px;
    }

    .favorite {
      font-size: 20px;
    }

    .add-btn {
      position: fixed;
      right: 22px;
      bottom: 22px;
      width: 58px;
      height: 58px;
      border: none;
      border-radius: 50%;
      background: #22c55e;
      color: #041009;
      font-size: 30px;
      cursor: pointer;
    }

    @media (max-width: 500px) {
      .card {
        padding: 28px 20px;
      }

      .brand {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN / LOCK SCREEN -->

  <main
    id="lockScreen"
    class="screen"
  >

    <section class="card">

      <div class="logo">
        🔐
      </div>

      <h1>
        MyVault
      </h1>

      <p class="subtitle">
        Your personal password manager
      </p>

      <div class="security-box">
        🛡️ Your vault is designed to use
        strong encryption.
      </div>

      <label for="masterPassword">
        Master Password
      </label>

      <div class="password-box">

        <input
          id="masterPassword"
          type="password"
          placeholder="Enter Master Password"
          autocomplete="off"
        >

        <button
          class="show-btn"
          onclick="togglePassword()"
          type="button"
        >
          👁
        </button>

      </div>

      <button
        class="primary-btn"
        onclick="unlockVault()"
        type="button"
      >
        🔓 Unlock Vault
      </button>

      <button
        class="secondary-btn"
        onclick="biometricMessage()"
        type="button"
      >
        👆 Use Fingerprint
      </button>

      <p class="footer">
        MyVault • Private & Secure
      </p>

    </section>

  </main>


  <!-- VAULT SCREEN -->

  <section
    id="vaultScreen"
    class="screen"
  >

    <div class="vault-container">

      <div class="topbar">

        <div class="brand">
          🔐 MyVault
        </div>

        <button
          class="lock-btn"
          onclick="lockVault()"
          type="button"
        >
          🔒 Lock
        </button>

      </div>

      <p class="welcome">
        Your encrypted password vault
      </p>

      <div class="search-box">

        <input
          id="searchInput"
          type="search"
          placeholder="🔍 Search passwords..."
          oninput="searchVault()"
        >

      </div>

      <div
        id="passwordItems"
        class="items"
      >

        <div class="item">

          <div>
            <div class="item-name">
              Google
            </div>

            <div class="item-user">
              example@gmail.com
            </div>
          </div>

          <div class="favorite">
            ⭐
          </div>

        </div>


        <div class="item">

          <div>
            <div class="item-name">
              Instagram
            </div>

            <div class="item-user">
              Instagram Account
            </div>
          </div>

          <div class="favorite">
            ⭐
          </div>

        </div>


        <div class="item">

          <div>
            <div class="item-name">
              Facebook
            </div>

            <div class="item-user">
              Facebook Account
            </div>
          </div>

          <div class="favorite">
            ☆
          </div>

        </div>

      </div>

    </div>

    <button
      class="add-btn"
      onclick="addPassword()"
      type="button"
    >
      +
    </button>

  </section>


  <!-- JAVASCRIPT -->

  <script>

    let vaultUnlocked = false;

    function togglePassword() {

      const input =
        document.getElementById("masterPassword");

      if (input.type === "password") {
        input.type = "text";
      } else {
        input.type = "password";
      }
    }


    function unlockVault() {

      const password =
        document.getElementById("masterPassword").value;

      if (!password) {

        alert(
          "Please enter your Master Password."
        );

        return;
      }

      /*
        TEMPORARY UI ONLY.

        Real Master Password verification
        and encrypted vault unlocking will
        be connected to crypto.js next.
      */

      vaultUnlocked = true;

      document.getElementById(
        "lockScreen"
      ).style.display = "none";

      document.getElementById(
        "vaultScreen"
      ).style.display = "block";
    }


    function lockVault() {

      vaultUnlocked = false;

      document.getElementById(
        "vaultScreen"
      ).style.display = "none";

      document.getElementById(
        "lockScreen"
      ).style.display = "flex";

      document.getElementById(
        "masterPassword"
      ).value = "";
    }


    function biometricMessage() {

      alert(
        "Biometric unlock will be connected in the mobile app version."
      );
    }


    function addPassword() {

      alert(
        "Secure Add Password screen will be added next."
      );
    }


    function searchVault() {

      const query =
        document.getElementById(
          "searchInput"
        ).value.toLowerCase();

      const items =
        document.querySelectorAll(".item");

      items.forEach(function(item) {

        const text =
          item.innerText.toLowerCase();

        if (text.includes(query)) {
          item.style.display = "flex";
        } else {
          item.style.display = "none";
        }

      });
    }

  </script>

</body>
</html>
