<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <title>Portal Matrix</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body style="background:#05040a; color:white; font-family:sans-serif; text-align:center; padding:20px;">

  <h2>✨ PORTAL MATRIX</h2>
  
  <div style="max-width:300px; margin:auto;">
    <input type="email" id="email" placeholder="Email" style="width:100%; padding:10px; margin:5px; border-radius:5px;">
    <input type="password" id="pass" placeholder="Password" style="width:100%; padding:10px; margin:5px; border-radius:5px;">
    
    <button onclick="checkAuth()" style="width:100%; padding:10px; margin:5px; background:#ff007f; color:white; border:none; border-radius:5px;">Login / Signup</button>
    <button onclick="checkGoogle()" style="width:100%; padding:10px; margin:5px; background:#4285F4; color:white; border:none; border-radius:5px;">Google Login</button>
    <button onclick="checkGuest()" style="width:100%; padding:10px; margin:5px; background:#555; color:white; border:none; border-radius:5px;">Guest Entry</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDbiMMJsay7Bv2nODc93Jhb9O8UtV6SPuo",
      authDomain: "piiyush-patii.firebaseapp.com",
      projectId: "piiyush-patii",
      storageBucket: "piiyush-patii.firebasestorage.app",
      messagingSenderId: "943004269137",
      appId: "1:943004269137:web:13e65558654621d4855670",
      measurementId: "G-QLKC2N0RWN"
    };

    // Firebase Initialize
    try {
        firebase.initializeApp(firebaseConfig);
        console.log("Firebase Connected");
    } catch(err) {
        alert("Firebase Error: " + err.message);
    }

    // Function checks
    function checkAuth() { 
        alert("Email Login बटण चाललंय!"); 
        const e = document.getElementById('email').value;
        const p = document.getElementById('pass').value;
        if(!e || !p) return alert("Email/Pass टाक!");
        firebase.auth().signInWithEmailAndPassword(e, p)
            .catch(() => firebase.auth().createUserWithEmailAndPassword(e, p).then(()=>alert("Account created!")));
    }

    function checkGoogle() { 
        alert("Google Login बटण चाललंय!"); 
        firebase.auth().signInWithRedirect(new firebase.auth.GoogleAuthProvider());
    }

    function checkGuest() { 
        alert("Guest बटण चाललंय!"); 
        window.location.href = "https://google.com"; // टेस्ट साठी
    }
  </script>
</body>
</html>
