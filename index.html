<!DOCTYPE html>
<html lang="mr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#08070d">

    <title>Shayari & Jokes</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- =========================
         HOME / DOORS SCREEN
    ========================== -->

    <section id="doors">

        <div class="logo">
            ✨ SHAYARI • JOKES
        </div>

        <p class="sub">
            एक दरवाजा निवड आणि आत ये 😄
        </p>


        <div class="doorWrap">


            <!-- =====================
                 SAD SHAYARI DOOR
            ====================== -->

            <button
                class="doorCard"
                data-type="shayari"
            >

                <div class="doorInner">

                    <div class="emoji">
                        💔
                    </div>

                    <h2>
                        Sad Shayari
                    </h2>

                    <span>
                        मनातील शब्द
                    </span>

                </div>


                <!-- Left door panel -->

                <div class="doorPanel left">
                </div>


                <!-- Right door panel -->

                <div class="doorPanel right">
                </div>

            </button>



            <!-- =====================
                 JOKES DOOR
            ====================== -->

            <button
                class="doorCard"
                data-type="joke"
            >

                <div class="doorInner">

                    <div class="emoji">
                        😂
                    </div>

                    <h2>
                        Jokes
                    </h2>

                    <span>
                        थोडं हसूया
                    </span>

                </div>


                <!-- Left door panel -->

                <div class="doorPanel left">
                </div>


                <!-- Right door panel -->

                <div class="doorPanel right">
                </div>

            </button>

        </div>


        <!-- Guest button -->

        <button
            id="guestBtn"
            class="ghostBtn"
        >
            👤 Continue as Guest
        </button>


        <!-- Login button -->

        <button
            id="loginTop"
            class="linkBtn"
        >
            Login / Register
        </button>

    </section>



    <!-- =========================
         MAIN WEBSITE
    ========================== -->

    <section
        id="app"
        class="hidden"
    >


        <!-- =====================
             NAVBAR
        ====================== -->

        <header class="nav">

            <b>
                ✨ Shayari & Jokes
            </b>


            <div>

                <span id="userBadge">
                </span>


                <button
                    id="authBtn"
                    class="smallBtn"
                >
                    Login
                </button>


                <button
                    id="logoutBtn"
                    class="smallBtn hidden"
                >
                    Logout
                </button>


                <button
                    id="homeBtn"
                    class="smallBtn"
                >
                    Home
                </button>

            </div>

        </header>



        <!-- =====================
             CONTENT
        ====================== -->

        <main class="container">


            <div class="topRow">

                <div>

                    <h1 id="title">
                        💔 Sad Shayari
                    </h1>

                    <p id="subtitle">
                        Feel every word ❤️
                    </p>

                </div>


                <!-- Create post -->

                <button
                    id="newPostBtn"
                    class="primaryBtn"
                >
                    ＋ My Post
                </button>

            </div>



            <!-- =====================
                 TABS
            ====================== -->

            <div class="tabs">

                <button
                    class="tab active"
                    data-type="shayari"
                >
                    💔 Shayari
                </button>


                <button
                    class="tab"
                    data-type="joke"
                >
                    😂 Jokes
                </button>

            </div>



            <!-- =====================
                 POSTS
            ====================== -->

            <div id="feed">

                <!-- JavaScript येथे posts दाखवेल -->

            </div>

        </main>

    </section>



    <!-- =========================
         LOGIN / REGISTER MODAL
    ========================== -->

    <div
        id="modal"
        class="modal hidden"
    >

        <div class="modalBox">


            <!-- Close -->

            <button
                class="close"
                id="closeModal"
            >
                ×
            </button>


            <!-- Login/Register content
                 JavaScript येथे टाकेल -->

            <div id="modalContent">
            </div>

        </div>

    </div>



    <!-- Toast message -->

    <div id="toast">
    </div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="app.js"></script>

</body>

</html>
