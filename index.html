<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dil & Hasi | शायरी आणि जोक्स</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Rozha+One&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    font-family:'Poppins', sans-serif;
    background:radial-gradient(circle at top, #1f1a3a 0%, #0c0d14 60%, #050508 100%);
    color:#fff;
    overflow-x:hidden;
}

/* ================= BACKGROUND PARTICLES ================= */
#particle-canvas{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    z-index:0;
    pointer-events:none;
}

/* ================= HOME / DOORS SCREEN ================= */
#home{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
    position:relative;
    z-index:5;
    transition:opacity 0.6s ease, transform 0.6s ease;
}

.logo-container{
    text-align:center;
    margin-bottom:20px;
}

.logo{
    font-size:28px;
    font-weight:700;
    letter-spacing:2px;
    background:linear-gradient(45deg, #ff758c, #ff7eb3, #70a1ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 10px 20px rgba(255,117,140,0.2);
}

.subtitle{
    font-size:14px;
    color:#a0a5b5;
    margin-top:4px;
}

.door-wrapper-title{
    margin-bottom:25px;
    font-size:16px;
    color:#e0e0e0;
    letter-spacing:1px;
    font-weight:600;
    text-shadow:0 0 10px rgba(255,255,255,0.2);
}

/* 3D Door Area */
.door-area{
    width:min(800px, 92vw);
    display:flex;
    gap:20px;
    perspective:1200px;
}

.door-card{
    flex:1;
    height:380px;
    position:relative;
    cursor:pointer;
    border-radius:20px;
    overflow:hidden;
    background:rgba(255, 255, 255, 0.03);
    border:2px solid rgba(255, 255, 255, 0.12);
    box-shadow:0 20px 50px rgba(0,0,0,0.6);
    transition:transform 0.3s ease, border-color 0.3s ease;
}

.door-card:hover{
    transform:translateY(-6px);
    border-color:rgba(255, 255, 255, 0.3);
}

/* Content Behind The Door */
.door-bg{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
    text-align:center;
    z-index:1;
}

.door-left .door-bg{
    background:linear-gradient(145deg, #3d1b38, #160a1a);
}

.door-right .door-bg{
    background:linear-gradient(145deg, #18384e, #091722);
}

.door-icon{
    font-size:60px;
    margin-bottom:12px;
    filter:drop-shadow(0 8px 15px rgba(0,0,0,0.4));
}

.door-title{
    font-size:24px;
    font-weight:700;
    margin-bottom:6px;
}

.door-small{
    font-size:13px;
    color:#ccc;
}

/* Real Animated 3D Doors */
.door-leaf{
    position:absolute;
    top:0;
    width:50%;
    height:100%;
    z-index:3;
    background:linear-gradient(135deg, rgba(255,255,255,0.12), rgba(20,20,30,0.85));
    backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,0.15);
    transition:transform 0.9s cubic-bezier(0.77, 0, 0.175, 1);
    pointer-events:none;
}

.door-leaf.left{
    left:0;
    transform-origin:left center;
    border-right:1px solid rgba(255,255,255,0.25);
}

.door-leaf.right{
    right:0;
    transform-origin:right center;
    border-left:1px solid rgba(255,255,255,0.25);
}

.door-card.open .door-leaf.left{
    transform:rotateY(-110deg);
}

.door-card.open .door-leaf.right{
    transform:rotateY(110deg);
}

.door-handle{
    width:10px;
    height:34px;
    background:linear-gradient(180deg, #ffeaa7, #d69e2e);
    border-radius:6px;
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    box-shadow:0 0 10px rgba(255, 234, 167, 0.5);
}

.door-leaf.left .door-handle{ right:10px; }
.door-leaf.right .door-handle{ left:10px; }

#home.hidden{
    opacity:0;
    transform:scale(1.05);
    pointer-events:none;
}

/* ================= MAIN APP ================= */
#app{
    display:none;
    min-height:100vh;
    position:relative;
    z-index:10;
    padding-bottom:50px;
}

#app.show{
    display:block;
    animation:appFadeIn 0.6s ease forwards;
}

@keyframes appFadeIn{
    from{ opacity:0; transform:translateY(25px); }
    to{ opacity:1; transform:translateY(0); }
}

.navbar{
    height:65px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:rgba(12, 13, 20, 0.85);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(255,255,255,0.1);
    position:sticky;
    top:0;
    z-index:100;
}

.nav-brand{
    font-size:19px;
    font-weight:700;
    background:linear-gradient(45deg, #ff7eb3, #70a1ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.back-btn{
    border:1px solid rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.08);
    color:#fff;
    padding:7px 15px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
}

.back-btn:hover{
    background:rgba(255,255,255,0.18);
}

.container{
    width:min(640px, 92vw);
    margin:25px auto 0;
}

.app-header{
    text-align:center;
    margin-bottom:20px;
}

.app-title{
    font-size:28px;
    font-weight:700;
}

.app-sub{
    font-size:14px;
    color:#8b949e;
    margin-top:2px;
}

.tabs-container{
    display:flex;
    background:rgba(255,255,255,0.06);
    padding:5px;
    border-radius:14px;
    margin-bottom:25px;
}

.tab-btn{
    flex:1;
    padding:11px;
    border:0;
    background:transparent;
    color:#8b949e;
    font-size:14px;
    font-weight:600;
    border-radius:10px;
    cursor:pointer;
    transition:0.2s;
}

.tab-btn.active{
    background:rgba(255,255,255,0.15);
    color:#fff;
}

/* Card */
.content-card{
    background:linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border:1px solid rgba(255,255,255,0.12);
    border-radius:20px;
    padding:30px 22px 20px;
    backdrop-filter:blur(20px);
    box-shadow:0 20px 40px rgba(0,0,0,0.5);
    animation:cardAppear 0.35s ease;
}

@keyframes cardAppear{
    from{ opacity:0; transform:scale(0.97); }
    to{ opacity:1; transform:scale(1); }
}

.card-badge{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    padding:4px 10px;
    border-radius:12px;
    background:rgba(255, 117, 140, 0.15);
    color:#ff758c;
    margin-bottom:15px;
}

.card-body-text{
    font-size:20px;
    line-height:1.7;
    text-align:center;
    margin:10px 0 20px;
    min-height:80px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Rozha One', serif;
    color:#f1f2f6;
}

.card-author{
    text-align:right;
    color:#8b949e;
    font-size:13px;
    border-bottom:1px solid rgba(255,255,255,0.06);
    padding-bottom:12px;
}

/* Actions */
.action-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
    margin-top:16px;
}

.btn-action{
    border:1px solid rgba(255,255,255,0.1);
    background:rgba(255,255,255,0.05);
    color:#ddd;
    padding:10px 5px;
    border-radius:12px;
    cursor:pointer;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:0.2s;
}

.btn-action:hover{
    background:rgba(255,255,255,0.12);
}

.btn-action.liked{
    color:#ff4757;
    background:rgba(255, 71, 87, 0.12);
    border-color:#ff4757;
}

/* Rating */
.rating-section{
    text-align:center;
    margin-top:20px;
    padding-top:12px;
}

.rating-title{
    font-size:12px;
    color:#8b949e;
}

.star-group{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-top:6px;
}

.star-icon{
    font-size:24px;
    color:#484f58;
    cursor:pointer;
    transition:0.2s;
}

.star-icon.active{
    color:#ffa502;
    text-shadow:0 0 10px rgba(255, 165, 2, 0.5);
}

/* Comments */
.comment-container{
    margin-top:18px;
    display:none;
}

.comment-container.open{
    display:block;
    animation:cardAppear 0.3s ease;
}

.comment-textarea{
    width:100%;
    min-height:70px;
    background:rgba(0,0,0,0.3);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:12px;
    padding:10px;
    color:#fff;
    font-family:'Poppins', sans-serif;
    font-size:13px;
    resize:none;
    outline:none;
}

.comment-submit{
    margin-top:6px;
    padding:8px 16px;
    border:0;
    border-radius:8px;
    background:#70a1ff;
    color:#000;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
}

.comment-list{
    margin-top:12px;
    max-height:140px;
    overflow-y:auto;
}

.single-comment{
    background:rgba(255,255,255,0.04);
    padding:8px 12px;
    border-radius:8px;
    font-size:12px;
    margin-bottom:6px;
}

/* Navigation */
.nav-controls{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
    gap:12px;
}

.btn-ctrl{
    flex:1;
    padding:12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.06);
    color:#fff;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
}

.btn-ctrl:hover{
    background:rgba(255,255,255,0.12);
}

@media(max-width:650px){
    .door-area{
        flex-direction:column;
        gap:16px;
    }
    .door-card{
        height:180px;
    }
    .door-icon{
        font-size:40px;
        margin-bottom:6px;
    }
    .door-title{
        font-size:20px;
    }
    .door-small{
        font-size:12px;
    }
    .action-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<canvas id="particle-canvas"></canvas>

<!-- ================= HOME SCREEN ================= -->
<section id="home">
    <div class="logo-container">
        <div class="logo">✨ DIL & HASI</div>
        <div class="subtitle">शायरी आणि मजेदार जोक्सचे जग</div>
    </div>

    <div class="door-wrapper-title">दरवाजा निवडा आणि आत या 👇</div>

    <div class="door-area">
        <!-- SHAYARI DOOR -->
        <div class="door-card door-left" onclick="openDoorNow('shayari')">
            <div class="door-bg">
                <div class="door-icon">💔</div>
                <div class="door-title">Sad Shayari</div>
                <div class="door-small">दिलाला स्पर्श करणारे शब्द</div>
            </div>
            <div class="door-leaf left"><div class="door-handle"></div></div>
            <div class="door-leaf right"></div>
        </div>

        <!-- JOKES DOOR -->
        <div class="door-card door-right" onclick="openDoorNow('jokes')">
            <div class="door-bg">
                <div class="door-icon">😂</div>
                <div class="door-title">Funny Jokes</div>
                <div class="door-small">हसून लोटपोट व्हा</div>
            </div>
            <div class="door-leaf left"></div>
            <div class="door-leaf right"><div class="door-handle"></div></div>
        </div>
    </div>
</section>

<!-- ================= APP INTERFACE ================= -->
<section id="app">
    <nav class="navbar">
        <div class="nav-brand">✨ Dil & Hasi</div>
        <button class="back-btn" onclick="backToHome()">🏠 मागे जा</button>
    </nav>

    <main class="container">
        <div class="app-header">
            <h1 class="app-title" id="appHeaderTitle">Sad Shayari</h1>
            <p class="app-sub" id="appHeaderSubtitle">Feel every word ❤️</p>
        </div>

        <div class="tabs-container">
            <button class="tab-btn active" id="tabShayari" onclick="switchCategory('shayari')">💔 शायरी</button>
            <button class="tab-btn" id="tabJokes" onclick="switchCategory('jokes')">😂 जोक्स</button>
        </div>

        <div id="cardRenderer"></div>

        <div class="nav-controls">
            <button class="btn-ctrl" onclick="moveSlide(-1)">← मागे</button>
            <button class="btn-ctrl" onclick="moveSlide(1)">पुढे →</button>
        </div>
    </main>
</section>

<script>
const database = {
    shayari: [
        {
            text: "कभी कभी किसी की खामोशी भी\nसब कुछ बयां कर देती है।",
            author: "— खामोश दिल"
        },
        {
            text: "हमने तो समझा था कि हम ही खास हैं,\nपर वक्त ने बता दिया कि हम सिर्फ एक वक्त का सहारा थे।",
            author: "— तन्हा मुसाफिर"
        },
        {
            text: "छोड़ दिया हमने भी लोगों को बेवजह परेशान करना,\nजब कोई अपना समझेगा तो खुद याद कर लेगा।",
            author: "— टूटा साया"
        },
        {
            text: "मुस्कुराने की आदत भी कितनी अजीब है,\nगम को छुपा लेती है और दुनिया समझती है कोई दर्द नहीं।",
            author: "— अनजान शायर"
        }
    ],
    jokes: [
        {
            text: "मास्तर: संजू, काल शाळेत का आला नव्हतास?\nसंजू: सर, काल माझ्या स्वप्नात तुळजाभवानी आली होती!\nमास्तर: मग काय म्हणाली देवी?\nसंजू: म्हणाली, बाळ आज शाळेत जाऊ नको, आराम कर! 😂",
            author: "— संजू बाबा"
        },
        {
            text: "पप्पू: यार, लग्नानंतर माणसात काय बदल होतो?\nगप्पू: काही नाही भावा, फक्त आधी स्वतःच्या मनाचं ऐकायचो,\nआता स्वतःच्या मनाला मारून बायकोचं ऐकावं लागतं! 🤣",
            author: "— गप्पू मास्टर"
        },
        {
            text: "डॉक्टर: वजन कमी करण्यासाठी रोज 5 किमी धावा.\nपप्पू: साहेब, 15 दिवसांत मी 75 किमी दूर पोहोचलोय,\nआता तिथून परत कसं येऊ? 🏃‍♂️😂",
            author: "— पप्पू द ग्रेट"
        }
    ]
};

let currentTab = "shayari";
let activeIndex = 0;

function openDoorNow(selected){
    currentTab = selected;
    activeIndex = 0;

    const clickedDoor = selected === 'shayari' 
        ? document.querySelector('.door-left') 
        : document.querySelector('.door-right');
    
    clickedDoor.classList.add('open');

    setTimeout(() => {
        const home = document.getElementById("home");
        home.classList.add("hidden");

        setTimeout(() => {
            home.style.display = "none";
            const app = document.getElementById("app");
            app.classList.add("show");
            switchCategory(selected);
        }, 500);
    }, 700);
}

function backToHome(){
    const app = document.getElementById("app");
    app.classList.remove("show");
    app.style.display = "none";

    const home = document.getElementById("home");
    home.style.display = "flex";
    
    setTimeout(() => {
        home.classList.remove("hidden");
        document.querySelectorAll(".door-card").forEach(d => d.classList.remove("open"));
    }, 50);
}

function switchCategory(cat){
    currentTab = cat;
    activeIndex = 0;

    document.getElementById("tabShayari").classList.toggle("active", cat === "shayari");
    document.getElementById("tabJokes").classList.toggle("active", cat === "jokes");

    if(cat === "shayari"){
        document.getElementById("appHeaderTitle").innerText = "💔 दर्द भरी शायरी";
        document.getElementById("appHeaderSubtitle").innerText = "शब्दांमधील भावना अनुभवा...";
    } else {
        document.getElementById("appHeaderTitle").innerText = "😂 धम्माल जोक्स";
        document.getElementById("appHeaderSubtitle").innerText = "हसा आणि तणाव दूर करा!";
    }

    displayCard();
}

function displayCard(){
    const list = database[currentTab];
    const item = list[activeIndex];
    const storageKey = `${currentTab}_${activeIndex}`;

    const likes = Number(localStorage.getItem(`${storageKey}_likes`) || 0);
    const hasLiked = localStorage.getItem(`${storageKey}_liked`) === "true";
    const rating = Number(localStorage.getItem(`${storageKey}_rating`) || 0);
    const comments = JSON.parse(localStorage.getItem(`${storageKey}_comments`) || "[]");

    const container = document.getElementById("cardRenderer");
    container.innerHTML = `
        <article class="content-card">
            <span class="card-badge">${currentTab === "shayari" ? "❤️ SHAYARI" : "⚡ JOKE"}</span>
            <div class="card-body-text">${cleanHTML(item.text).replace(/\n/g, "<br>")}</div>
            <div class="card-author">${cleanHTML(item.author)}</div>

            <div class="action-grid">
                <button class="btn-action ${hasLiked ? 'liked' : ''}" onclick="togglePostLike()">
                    <span>${hasLiked ? '❤️' : '🤍'}</span>
                    <span>${likes} Likes</span>
                </button>
                <button class="btn-action" onclick="toggleCommentSection()">
                    <span>💬</span>
                    <span>${comments.length} Comments</span>
                </button>
                <button class="btn-action" onclick="sharePost()">
                    <span>📤 Share</span>
                </button>
            </div>

            <div class="rating-section">
                <div class="rating-title">रेट करा:</div>
                <div class="star-group">
                    ${[1, 2, 3, 4, 5].map(star => `
                        <span class="star-icon ${star <= rating ? 'active' : ''}" onclick="giveRating(${star})">★</span>
                    `).join('')}
                </div>
            </div>

            <div id="commentBoxArea" class="comment-container">
                <textarea id="commentInputArea" class="comment-textarea" placeholder="तुमची प्रतिक्रिया लिहा..."></textarea>
                <button class="comment-submit" onclick="submitUserComment()">कमेंट पोस्ट करा</button>
                <div class="comment-list">
                    ${comments.map(c => `<div class="single-comment">💬 ${cleanHTML(c)}</div>`).join('')}
                </div>
            </div>
        </article>
    `;
}

function togglePostLike(){
    const key = `${currentTab}_${activeIndex}`;
    let likes = Number(localStorage.getItem(`${key}_likes`) || 0);
    let hasLiked = localStorage.getItem(`${key}_liked`) === "true";

    if(hasLiked){
        likes = Math.max(0, likes - 1);
        localStorage.setItem(`${key}_liked`, "false");
    } else {
        likes++;
        localStorage.setItem(`${key}_liked`, "true");
    }

    localStorage.setItem(`${key}_likes`, likes);
    displayCard();
}

function giveRating(score){
    const key = `${currentTab}_${activeIndex}`;
    localStorage.setItem(`${key}_rating`, score);
    displayCard();
}

function toggleCommentSection(){
    const box = document.getElementById("commentBoxArea");
    if(box) box.classList.toggle("open");
}

function submitUserComment(){
    const input = document.getElementById("commentInputArea");
    const val = input.value.trim();
    if(!val) return;

    const key = `${currentTab}_${activeIndex}`;
    const comments = JSON.parse(localStorage.getItem(`${key}_comments`) || "[]");
    comments.unshift(val);
    localStorage.setItem(`${key}_comments`, JSON.stringify(comments));

    displayCard();
    setTimeout(() => {
        document.getElementById("commentBoxArea")?.classList.add("open");
    }, 10);
}

function moveSlide(direction){
    const len = database[currentTab].length;
    activeIndex = (activeIndex + direction + len) % len;
    displayCard();
}

function sharePost(){
    const item = database[currentTab][activeIndex];
    if(navigator.share){
        navigator.share({
            title: "Dil & Hasi",
            text: item.text
        });
    } else {
        navigator.clipboard.writeText(item.text).then(() => {
            alert("मजकूर कॉपी झाला आहे! 📋");
        });
    }
}

function cleanHTML(str){
    return str.replace(/[&<>"']/g, match => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    }[match]));
