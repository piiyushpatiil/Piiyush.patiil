<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Matrix Live</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <style>
    body { background: #05040a; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
    /* Screen Containers */
    .screen { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 400px; margin: auto; }
    #auth-screen { display: flex; }
    /* UI Elements */
    input { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: white; }
    button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
    /* Doors */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
    .door { height: 100px; background: #222; display: flex; align-items: center; justify-content: center; border-radius: 10px; cursor: pointer; transition: 0.3s; }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="screen">
    <h2>✨ PORTAL MATRIX</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="handleEmail()" style="background:#ff007f; color:white;">Login / Sign Up</button>
    <button onclick="handleGoogle()" style="background:#4285F4; color:white;">Google Login</button>
    <button onclick="handleGuest()" style="background:#555; color:white;">Guest Entry</button>
  </div>

  <!-- PORTAL SCREEN -->
  <div id="portal-screen" class="screen">
    <button onclick="logout()">Logout</button>
    <div class="grid">
      <div class="door" onclick="alert('Coming Soon')">💔 Shayari</div>
      <div class="door" onclick="alert('Coming Soon')">😂 Jokes</div>
      <div class="door" onclick="showChat()" style="background:#00f2fe; color:black;">🌐 Live Chat</div>
      <div class="door" onclick="alert('Coming Soon')">🔒 Private</div>
      <div class="door" onclick="alert('Coming Soon')">📰 News</div>
      <div class="door" onclick="alert('Coming Soon')">⏳ Secret</div>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chat-screen" class="screen">
    <button onclick="hideChat()">⬅️ Back</button>
    <div id="chatBox" style="width:100%; height:300px; overflow-y:auto; background:#111; padding:10px; margin:10px 0;"></div>
    <input type="text" id="msg" placeholder="Type...">
    <button onclick="sendMsg()" style="background:#00f2fe; color:black;">Send</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDbiMMJsay7Bv2nODc93Jhb9O8UtV6SPuo",
      authDomain: "piiyush-patii.firebaseapp.com",
      projectId: "piiyush-patii",
      storageBucket: "piiyush-patii.firebasestorage.app",
      messagingSenderId: "943004269137",
      appId: "1:943004269137:web:13e65558654621d4855670",
      measurementId: "G-QLKC2N0RWN"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let user = "Guest";

    // Auth Logic
    auth.onAuthStateChanged(u => { if(u) { user = u.email; showScreen('portal-screen'); } });
    
    function handleGoogle() { auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()); }
    function handleGuest() { user = prompt("Name:"); showScreen('portal-screen'); }
    function handleEmail() {
      const e = document.getElementById('email').value, p = document.getElementById('pass').value;
      auth.signInWithEmailAndPassword(e, p).catch(() => auth.createUserWithEmailAndPassword(e, p));
    }
    function logout() { auth.signOut().then(() => location.reload()); }

    // Screen Control
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        document.getElementById(id).style.display = 'flex';
    }

    // Chat Logic
    function showChat() { showScreen('chat-screen'); }
    function hideChat() { showScreen('portal-screen'); }

    db.collection("world_chats").orderBy("time").onSnapshot(snap => {
        let h = "";
        snap.forEach(d => { h += `<div style="padding:5px;"><b>${d.data().u}:</b> ${d.data().text}</div>`; });
        document.getElementById('chatBox').innerHTML = h;
    });

    function sendMsg() {
        const text = document.getElementById('msg').value;
        db.collection("world_chats").add({ u: user, text: text, time: firebase.firestore.FieldValue.serverTimestamp() });
        document.getElementById('msg').value = "";
    }
  </script>
</body>
</html>
