<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Hand Tracking Video Maker</title>
    
    <!-- AI Hand Tracking Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: black; 
            color: #00ffcc; 
            font-family: monospace; 
        }
        /* व्हिडिओ लपवणे आणि कॅनव्हासवर दाखवणे जेणेकरून इफेक्ट लावता येईल */
        video { display: none; } 
        canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
            transform: scaleX(-1); /* आरशासारखा इफेक्ट */
        }
        #ui { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            z-index: 10; 
            font-size: 18px; 
            text-shadow: 2px 2px 4px #000000; 
        }
    </style>
</head>
<body>

    <div id="ui">
        Scanning Hand...<br>
        <span id="status">Waiting for camera...</span>
    </div>
    
    <video id="input_video" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusText = document.getElementById('status');

        // स्क्रीनच्या आकारानुसार कॅनव्हास सेट करणे
        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // हात ओळखल्यावर काय करायचे त्याचे कोडिंग
        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // कॅमेराचा व्हिडिओ बॅकग्राउंडला दाखवणे
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                for (const landmarks of results.multiHandLandmarks) {
                    // हातावर गुलाबी रंगाची वायरफ्रेम (आकृती) काढणे
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#ff00ff', lineWidth: 3});
                    // सांध्यांवर (Joints) निळ्या रंगाचे ठिपके काढणे
                    drawLandmarks(canvasCtx, landmarks, {color: '#00ffcc', lineWidth: 1, radius: 4});
                    
                    // हाताच्या मध्यभागाचे X आणि Y नंबर्स दाखवणे
                    const x = Math.round(landmarks[9].x * 1000);
                    const y = Math.round(landmarks[9].y * 1000);
                    statusText.innerText = `x: ${x} y: ${y} \nTracking Active!`;
                }
            } else {
                statusText.innerText = "Bring your hand in front of camera";
            }
            canvasCtx.restore();
        }

        // AI मॉडेल सेट करणे
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        
        hands.setOptions({
            maxNumHands: 2, // एकाच वेळी २ हात ओळखेल
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        hands.onResults(onResults);

        // कॅमेरा चालू करणे
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });
        camera.start();
    </script>
</body>
</html>
