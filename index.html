<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dil & Hasi | शायरी आणि जोक्स</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      overflow-x: hidden;
    }

    /* Header & Auth */
    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 15px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
    }

    .logo {
      font-size: 1.3rem;
      font-weight: bold;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-btn {
      background: linear-gradient(45deg, #4285F4, #34A853);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      transition: 0.3s;
    }

    /* 3D Doors Section */
    .doors-container {
      display: flex;
      gap: 15px;
      width: 100%;
      max-width: 600px;
      margin-bottom: 25px;
      perspective: 1000px;
    }

    .door-wrapper {
      flex: 1;
      height: 120px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 15px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .door {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: left;
    }

    .door.shayari { background: linear-gradient(135deg, #833ab4, #fd1d1d); }
    .door.jokes { background: linear-gradient(135deg, #f12711, #f5af19); }

    .door-wrapper.active .door {
      transform: rotateY(-110deg);
    }

    .door-inside {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: bold;
      color: #00ffcc;
      z-index: -1;
    }

    /* Post Feed */
    .feed {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .post-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #bbb;
      margin-bottom: 10px;
    }

    .post-content {
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 15px;
      white-space: pre-line;
    }

    .post-actions {
      display: flex;
      gap: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 10px;
      align-items: center;
    }

    .action-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.9rem;
    }

    /* Floating Add Post Button */
    .fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      color: white;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: none;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Modal Form */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-content {
      background: #24243e;
      padding: 20px;
      border-radius: 15px;
      width: 100%;
      max-width: 450px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .modal-content textarea, .modal-content select, .modal-content input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #444;
      background: #1a1a2e;
      color: white;
    }

    .modal-content button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #ff416c;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">✨ Dil & Hasi</div>
    <button id="auth-btn" class="auth-btn" onclick="handleAuth()">Google Login</button>
  </header>

  <!-- Doors -->
  <div class="doors-container">
    <div class="door-wrapper" id="door-shayari" onclick="toggleDoor('shayari')">
      <div class="door shayari">💔 दर्दभरी शायरी</div>
      <div class="door-inside">Loading...</div>
    </div>
    <div class="door-wrapper" id="door-jokes" onclick="toggleDoor('jokes')">
      <div class="door jokes">😂 धम्माल जोक्स</div>
      <div class="door-inside">Loading...</div>
    </div>
  </div>

  <!-- Feed -->
  <div class="feed" id="feed">
    <div style="text-align: center; color: #888;">लोड होत आहे...</div>
  </div>

  <!-- Add Post FAB -->
  <button class="fab" onclick="openModal()">➕</button>

  <!-- Add Post Modal -->
  <div class="modal" id="postModal">
    <div class="modal-content">
      <h3>नवीन पोस्ट करा</h3>
      <select id="postCategory">
        <option value="shayari">💔 दर्दभरी शायरी</option>
        <option value="jokes">😂 धम्माल जोक्स</option>
      </select>
      <textarea id="postText" rows="4" placeholder="येथे तुमची शायरी किंवा जोक लिहा..."></textarea>
      <button onclick="submitPost()">पोस्ट अपलोड करा</button>
      <button style="background: #555; margin-top: 5px;" onclick="closeModal()">रद्द करा</button>
    </div>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyObiMMjsay7Bv2nODc93Jhb908UtV6SPuo",
      authDomain: "piiyush-patii.firebaseapp.com",
      projectId: "piiyush-patii",
      storageBucket: "piiyush-patii.firebasestorage.app",
      messagingSenderId: "943004269137",
      appId: "1:943004269137:web:13e65558654621d4855670",
      measurementId: "G-QLKC2N0RWN"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let currentCategory = 'shayari';

    // Auth Listener
    auth.onAuthStateChanged(user => {
      currentUser = user;
      const btn = document.getElementById('auth-btn');
      if (user) {
        btn.innerText = `बाहेर पडा (${user.displayName.split(' ')[0]})`;
      } else {
        btn.innerText = "Google Login";
      }
    });

    function handleAuth() {
      if (currentUser) {
        auth.signOut();
      } else {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(err => alert(err.message));
      }
    }

    // Door Selector
    function toggleDoor(type) {
      currentCategory = type;
      document.getElementById('door-shayari').classList.toggle('active', type === 'shayari');
      document.getElementById('door-jokes').classList.toggle('active', type === 'jokes');
      loadPosts(type);
    }

    // Load Posts
    function loadPosts(category) {
      db.collection("posts")
        .where("category", "==", category)
        .onSnapshot(snapshot => {
          const feed = document.getElementById('feed');
          feed.innerHTML = "";
          if (snapshot.empty) {
            feed.innerHTML = `<div style="text-align: center; color: #888;">या विभागात अजून कोणतीही पोस्ट नाही. पहिली पोस्ट तुम्ही करा!</div>`;
            return;
          }
          snapshot.forEach(doc => {
            const data = doc.data();
            feed.innerHTML += `
              <div class="post-card">
                <div class="post-header">
                  <span>✍️ ${data.author || 'Anonymous'}</span>
                  <span>${data.likes || 0} Likes</span>
                </div>
                <div class="post-content">${data.text}</div>
                <div class="post-actions">
                  <button class="action-btn" onclick="likePost('${doc.id}', ${data.likes || 0})">❤️ Like</button>
                  <button class="action-btn" onclick="sharePost('${data.text}')">📤 Share</button>
                </div>
              </div>
            `;
          });
        });
    }

    // Like Post
    function likePost(id, currentLikes) {
      db.collection("posts").doc(id).update({
        likes: currentLikes + 1
      });
    }

    // Share Post
    function sharePost(text) {
      if (navigator.share) {
        navigator.share({ title: 'Dil & Hasi Post', text: text });
      } else {
        navigator.clipboard.writeText(text);
        alert("पोस्ट कॉपी झाली आहे!");
      }
    }

    // Modal Operations
    function openModal() {
      if (!currentUser) {
        alert("कृपया पोस्ट करण्यासाठी आधी वरून Google Login करा!");
        return;
      }
      document.getElementById('postModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('postModal').style.display = 'none';
    }

    function submitPost() {
      const text = document.getElementById('postText').value.trim();
      const category = document.getElementById('postCategory').value;
      if (!text) return alert("कृपया मजकूर टाईप करा!");

      db.collection("posts").add({
        text: text,
        category: category,
        author: currentUser.displayName,
        likes: 0,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        document.getElementById('postText').value = "";
        closeModal();
      });
    }

    // Default Load
    toggleDoor('shayari');
  </script>
</body>
</html>
