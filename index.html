<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1110">
  <title>MyVault - Personal Password Manager</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #07100f;
      color: #ffffff;
      min-height: 100vh;
    }

    .app {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #101b19;
      border: 1px solid #243a35;
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 22px;
      background: #22c55e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9aada8;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .security {
      background: #0b1513;
      border: 1px solid #243a35;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 24px;
      color: #b8c8c4;
      font-size: 13px;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #dce8e5;
      font-size: 14px;
    }

    .password-box {
      position: relative;
    }

    input {
      width: 100%;
      padding: 15px;
      padding-right: 50px;
      border-radius: 12px;
      border: 1px solid #304943;
      background: #0b1513;
      color: white;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #22c55e;
    }

    .show-btn {
      position: absolute;
      right: 12px;
      top: 12px;
      background: none;
      border: none;
      color: #8da39d;
      font-size: 18px;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      margin-top: 18px;
      background: #22c55e;
      color: #041009;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .fingerprint {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      background: transparent;
      border: 1px solid #304943;
      border-radius: 12px;
      color: #dce8e5;
      cursor: pointer;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #71857f;
      font-size: 12px;
    }

    /* Vault screen */

    #vaultScreen {
      display: none;
      width: 100%;
      min-height: 100vh;
      padding: 20px;
    }

    .vault-container {
      max-width: 900px;
      margin: auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .brand {
      font-size: 24px;
      font-weight: bold;
    }

    .lock-btn {
      background: #172521;
      border: 1px solid #304943;
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
    }

    .welcome {
      color: #8fa49e;
      margin-bottom: 20px;
    }

    .search {
      margin-bottom: 20px;
    }

    .items {
      display: grid;
      gap: 12px;
    }

    .item {
      background: #101b19;
      border: 1px solid #243a35;
      padding: 18px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .item-user {
      color: #899e98;
      font-size: 13px;
    }

    .add-btn {
      position: fixed;
      right: 22px;
      bottom: 22px;
      width: 58px;
      height: 58px;
      border: none;
      border-radius: 50%;
      background: #22c55e;
      color: #041009;
      font-size: 28px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- LOCK SCREEN -->
  <main class="app" id="lockScreen">

    <section class="card">

      <div class="logo">🔐</div>

      <h1>MyVault</h1>

      <p class="subtitle">
        Your personal password manager
      </p>

      <div class="security">
        🛡️ Your vault will be protected with strong encryption.
      </div>

      <label for="masterPassword">
        Master Password
      </label>

      <div class="password-box">

        <input
          id="masterPassword"
          type="password"
          placeholder="Enter your master password"
          autocomplete="off"
        >

        <button
          class="show-btn"
          onclick="togglePassword()"
          aria-label="Show password"
        >
          👁
        </button>

      </div>

      <button class="btn" onclick="unlockVault()">
        🔓 Unlock Vault
      </button>

      <button class="fingerprint" onclick="biometricMessage()">
        👆 Use Fingerprint
      </button>

      <p class="footer">
        MyVault • Personal & Private
      </p>

    </section>

  </main>


  <!-- VAULT SCREEN -->
  <section id="vaultScreen">

    <div class="vault-container">

      <div class="topbar">

        <div class="brand">
          🔐 MyVault
        </div>

        <button class="lock-btn" onclick="lockVault()">
          🔒 Lock
        </button>

      </div>

      <p class="welcome">
        Your encrypted password vault
      </p>

      <div class="search">
        <input
          type="search"
          placeholder="🔍 Search passwords..."
          id="searchInput"
        >
      </div>

      <div class="items">

        <div class="item">
          <div>
            <div class="item-name">Google</div>
            <div class="item-user">example@gmail.com</div>
          </div>
          <div>⭐</div>
        </div>

        <div class="item">
          <div>
            <div class="item-name">Instagram</div>
            <div class="item-user">Your Instagram account</div>
          </div>
          <div>⭐</div>
        </div>

        <div class="item">
          <div>
            <div class="item-name">Facebook</div>
            <div class="item-user">Your Facebook account</div>
          </div>
          <div>☆</div>
        </div>

      </div>

    </div>

    <button class="add-btn" onclick="addPassword()">
      +
    </button>

  </section>


  <script>

    function togglePassword() {
      const input = document.getElementById("masterPassword");

      if (input.type === "password") {
        input.type = "text";
      } else {
        input.type = "password";
      }
    }

    function unlockVault() {

      const password =
        document.getElementById("masterPassword").value;

      if (!password) {
        alert("Please enter your Master Password.");
        return;
      }

      /*
        IMPORTANT:
        This is only a UI demonstration.

        Real Master Password verification,
        key derivation and vault encryption
        will be implemented separately.
      */

      document.getElementById("lockScreen").style.display = "none";
      document.getElementById("vaultScreen").style.display = "block";
    }

    function lockVault() {

      document.getElementById("vaultScreen").style.display = "none";
      document.getElementById("lockScreen").style.display = "flex";

      document.getElementById("masterPassword").value = "";
    }

    function biometricMessage() {
      alert("Biometric unlock will be added in the secure app version.");
    }

    function addPassword() {
      alert("Add Password screen will be added next.");
    }

  </script>

</body>
</html>
