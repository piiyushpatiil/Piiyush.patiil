<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AR Website</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: black; 
            color: white; 
            font-family: monospace;
        }
        #webcam { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
            z-index: -1; 
        }
        #coordinates { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            font-size: 20px; 
            color: #00ffcc; 
            text-shadow: 2px 2px 4px #000000;
            z-index: 2;
        }
        canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
            pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <video id="webcam" autoplay playsinline></video>
    
    <div id="coordinates">
        Scanning Target...<br>
        x: <span id="posX">0</span> y: <span id="posY">0</span>
    </div>

    <script>
        // कॅमेरा चालू करण्यासाठी
        const video = document.getElementById('webcam');
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(stream) {
                video.srcObject = stream;
            })
            .catch(function(error) {
                console.error("Camera Error", error);
                alert("Please allow camera access.");
            });
        }

        // 3D बॉक्स (Cube) बनवण्यासाठी
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true }); 
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshBasicMaterial({ color: 0xff00ff, wireframe: true }); 
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);
        
        camera.position.z = 5;

        // अ‍ॅनिमेशन लूप
        function animate() {
            requestAnimationFrame(animate);
            
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;

            document.getElementById('posX').innerText = Math.floor(Math.random() * 200 + 400);
            document.getElementById('posY').innerText = Math.floor(Math.random() * 200 + 200);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
